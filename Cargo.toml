[workspace]
resolver = "2"
members = ["engine", "games/sandbox", "tools/script_editor", "games/mushroom_man", "games/walkaround_demo", "games/dreamscape"]

[workspace.dependencies]
sdl2 = { version = "0.37" }
glow = "0.14"
glam = { version = "0.29", features = ["bytemuck"] }
hecs = "0.10"
tobj = "4.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
egui = "0.29"
egui_glow = "0.29"
egui_dock = "0.15"
rfd = "0.15"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
notify = "6"
gltf = { version = "1", features = ["utils"] }
bincode = "1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo build --profile profiling`: release speed (opt-level 3) with symbols
# and a quicker link, for measuring with `ENGINE_PROF=1` / a sampling profiler.
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 8
strip = false
debug = 1

# === perf === dev/test speed (see plans/perf-briefs/NOTES-loadspikes.md)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Line tables keep panic backtraces readable; full DWARF only slows linking.
[profile.dev.package.dreamscape]
debug = "line-tables-only"
