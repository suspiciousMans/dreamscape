name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workspace vendors SDL2 (sdl2-sys "bundled" feature), which
      # compiles it from source via CMake + a C compiler matching whatever
      # Rust host toolchain is active. Locally that's the GNU host
      # (x86_64-pc-windows-gnu) with a MinGW-w64 gcc — .cargo/config.toml's
      # CFLAGS/CMAKE_POLICY_VERSION_MINIMUM env vars are written for that
      # exact combination, so CI matches it rather than the MSVC default.
      - name: Install MinGW-w64 (gcc + cmake, for the GNU host toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
          path-type: inherit

      - name: Switch to the GNU host toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        shell: pwsh
        run: cargo build --workspace --verbose

      - name: Run engine test suite
        shell: pwsh
        run: cargo test -p engine --verbose

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries (SDL2 build deps, ALSA, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libgl1-mesa-dev xvfb x11-apps imagemagick

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy (dreamscape)
        run: cargo clippy -p dreamscape --all-targets -- -D clippy::correctness

      - name: Test engine and dreamscape
        run: cargo test -p engine -p dreamscape

      - name: Dream screenshots (every dream type, autopilot, software GL)
        run: games/dreamscape/tools/screenshots.sh target/dream-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream-shots
          path: target/dream-shots
