<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamscape</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #bcabae; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em;
    text-transform: uppercase; pointer-events: none; text-align: center; padding: 24px;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading dreams…</div>
<script>
  var statusEl = document.getElementById("status");
  var canvas = document.getElementById("canvas");
  // SDL sizes a resizable window's canvas to the element's CSS size on
  // every window resize event, so forward element resizes (e.g. an iframe
  // growing, or fullscreen) as window resizes.
  var Module = {
    canvas: canvas,
    arguments: [],
    preRun: [function () { if (/[?&]log=1/.test(location.search)) ENV.RUST_LOG = "info"; }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      var m = t && t.match(/\((\d+)\/(\d+)\)/);
      statusEl.textContent = m ? "Loading dreams… " + Math.round((100 * m[1]) / m[2]) + "%" : t ? "Loading dreams…" : "";
    },
    onRuntimeInitialized: function () { statusEl.textContent = ""; canvas.focus(); },
    onAbort: function () { statusEl.textContent = "Dreamscape crashed. Reload to try again."; },
  };
  if (!document.createElement("canvas").getContext("webgl2")) {
    statusEl.textContent = "Dreamscape needs WebGL2, which this browser doesn't support.";
  }
  canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  new ResizeObserver(function () { window.dispatchEvent(new Event("resize")); }).observe(canvas);
</script>
<script src="dreamscape.js"></script>
</body>
</html>
