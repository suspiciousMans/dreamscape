[package]
name = "dreamscape"
version = "0.1.0"
edition = "2021"
# Proprietary — see ../../LICENSE. Not a crates.io crate.
license-file = "../../LICENSE"
publish = false

[dependencies]
engine = { path = "../../engine" }
glam = { workspace = true }
hecs = { workspace = true }
anyhow = "1.0"
log = "0.4"
rand = "0.8"
env_logger = "0.11"
serde = { workspace = true }
ron = { workspace = true }
image = { workspace = true }
steamworks = { version = "0.13", optional = true }

[[bin]]
name = "dreamscape"
path = "src/main.rs"

[features]
# Keep DREAMSCAPE_* dev switches working in a release build (for testing a
# packaged copy). Never ship with this on.
dev = []
# Steamworks: achievements (and later lobbies). Off by default; needs the
# Steam client running, and steam_appid.txt next to the exe for dev runs.
steam = ["dep:steamworks"]
